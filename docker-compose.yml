services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matriz
      POSTGRES_PASSWORD: matriz
      POSTGRES_DB: matriz
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matriz -d matriz"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PROCESS_ROLE: web
      DATABASE_URL: postgresql://matriz:matriz@postgres:5432/matriz
      APP_URL: http://localhost:3000
      WHATSAPP_ENABLED: "false"
      AI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      PROCESS_ROLE: worker
      DATABASE_URL: postgresql://matriz:matriz@postgres:5432/matriz
      APP_URL: http://localhost:3000
      WHATSAPP_ENABLED: "false"
      AI_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
